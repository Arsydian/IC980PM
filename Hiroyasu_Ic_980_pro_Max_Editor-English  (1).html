<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiroyasu IC-980 Pro Max - YSF & CSV Editor by Ranke YU6RDR</title>
<style>
:root {
  --bg: #12151c; --card: #1c212c; --bd: #2e3646; --fg: #e2e8f0; --mut: #94a3b8;
  --ac: #2563eb; --ac-h: #1d4ed8; --sel: #1e293b; --warn: #ef4444; --succ: #22c55e;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 Arial, sans-serif; }
h1 { font-size: 20px; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, input[type="file"]::file-selector-button {
  background: var(--ac); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px;
  font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.15s;
}
button:hover { background: var(--ac-h); }
button.o { background: transparent; color: var(--mut); border: 1px solid var(--bd); }
button.o:hover { background: var(--bd); color: #fff; }
button.danger { background: var(--warn); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.file-input { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--bd); padding: 6px 10px; border-radius: 6px; }
#wrap { max-height: 65vh; overflow: auto; border: 1px solid var(--bd); border-radius: 6px; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--bd); white-space: nowrap; }
th { position: sticky; top: 0; background: #252d3d; z-index: 2; font-size: 12px; }
th small { display: block; color: var(--mut); font-weight: normal; }
tr.r { cursor: pointer; }
tr.r:hover { background: #232b3b; }
tr.sel { background: var(--sel) !important; border-left: 3px solid var(--ac); }
input[type="text"], input[type="number"], input[type="search"], select {
  background: #11141a; border: 1px solid var(--bd); color: var(--fg); padding: 4px 6px; border-radius: 4px; font-size: 12px;
}
select:disabled { opacity: 0.35; }
input.nm { width: 150px; } input.fq { width: 105px; } input.of { width: 80px; }
.msg { margin-top: 8px; font-size: 13px; font-weight: bold; }
.err { color: var(--warn); }
.succ { color: var(--succ); }
.hint { color: var(--mut); font-size: 12px; margin-top: 6px; font-weight: normal; }
.der { color: var(--mut); }

th.gs, td.gs { border-left: 3px solid var(--ac); }
input.cm { width: 120px; }

th.gs, td.gs { border-left: 3px solid var(--ac); }
input.cm { width: 120px; }
tr.r.sel { background: #1e3a5f !important; box-shadow: inset 3px 0 0 var(--ac); }
tr.r td:first-child { user-select: none; cursor: default; }
#ctx { position: fixed; z-index: 60; background: #232b3b; border: 1px solid var(--bd); border-radius: 6px; padding: 4px 0; min-width: 270px; box-shadow: 0 8px 24px #000a; font-size: 13px; }
#ctx[hidden], .modal[hidden] { display: none; }
.mi { position: relative; display: flex; justify-content: space-between; gap: 22px; padding: 6px 14px; cursor: pointer; }
.mi:hover { background: var(--ac); }
.mi small { color: var(--mut); } .mi:hover small { color: #dbeafe; }
.mi.dis { opacity: .4; cursor: default; } .mi.dis:hover { background: none; }
.msep { height: 1px; background: var(--bd); margin: 4px 0; }
.submenu { display: none; position: absolute; left: 100%; top: -5px; background: #232b3b; border: 1px solid var(--bd); border-radius: 6px; padding: 4px 0; min-width: 250px; box-shadow: 0 8px 24px #000a; }
.mi.has:hover > .submenu { display: block; } .mi.dis > .submenu { display: none !important; }
#ctx.left .submenu { left: auto; right: 100%; }
.modal { position: fixed; inset: 0; background: #000a; z-index: 70; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.mbox { background: var(--card); border: 1px solid var(--bd); border-radius: 8px; width: min(980px, 100%); padding: 16px; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: bold; font-size: 15px; }
.props { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 14px; }
.props label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mut); }
.props input, .props select { width: 100% !important; }
.hexgrid { font-family: Consolas, "Courier New", monospace; font-size: 13px; margin: 8px 0 12px; }
.ho { display: inline-block; width: 30px; color: var(--mut); }
.hb { display: inline-block; width: 26px; text-align: center; border-radius: 3px; }
.hb.z { color: #4b5565; } .hb.k { background: #1e3a5f; color: #fff; } .hb.d { background: var(--warn) !important; color: #fff; }
table.ft { width: auto; } table.ft td { padding: 3px 14px 3px 0; border-bottom: 1px solid var(--bd); }
.dh { font-weight: bold; margin-top: 8px; }
#mbody pre { max-height: 55vh; overflow: auto; background: #11141a; padding: 10px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }

<script id="codec">

// ===== Struktura .Ysf fajla (47.046 B) =====
// Zaglavlje 564 B | 500 zapisa x 85 B | rep (sistemska podešavanja) 3.982 B
const HEADER_SIZE = 564, REC_SIZE = 85, MAX_CH = 500, TAIL_SIZE = 3982;
const TAIL_OFFSET = HEADER_SIZE + MAX_CH * REC_SIZE;      // 43064
const TOTAL_FILE_SIZE = TAIL_OFFSET + TAIL_SIZE;          // 47046
// Pomeraji unutar zapisa kanala:
const F_RX = 0, F_TX = 14;                // u32 LE, Hz
const F_RXT = 28, F_RXT_TYPE = 30;        // RX ton: vrednost (u16 LE) + tip
const F_TXT = 41, F_TXT_TYPE = 43;        // TX ton: vrednost (u16 LE) + tip
const F_MODE = 58, F_FLAGS = 60, F_NAME = 63, NAME_LEN = 16;
// Tip tona: 0 = bez tona, 1 = CTCSS (vrednost = Hz x 10), 2 = DCS normalni, 3 = DCS invertovani
// DCS vrednost = 0x2800 | šifra (oktalne cifre čitane kao broj, npr. 025 -> 0x15)
// Bajt 57: bitovi 3-4 = Busy Inhibit (0 OFF, 1 DQT, 2 CAT), bitovi 5-6 = Rx signal Code (0 OFF, 1 DTMF, 2 FSK, 3 FSK DTMF)
// Bajt 58: bit 7 = Scan (1 ADD, 0 DEL), bit 5 = TX Power (1 High, 0 Low), bit 4 = Bandwidth (1 Wide, 0 Narrow),
//          bitovi 1-3 = Special DCS (0 OFF, 1-4), bit 0 = Compando (1 ON)
// Bajt 59: bitovi 0-3 = scramble (0 OFF, 1-8), bit 4 = Vague Subaudio (1 ON)
// Bajt 60: bit 2 = FM/AM (1 AM), bitovi 4-5 = tip RX tona (Dec), bitovi 6-7 = tip TX tona (Enc)
// Bajt 61 = PTT Push Code, bajt 62 = PTT Pop Code: 0 OFF, 1 ID, 2.. = Code form-1.. (n+1)
// Nepoznati bitovi u ovim bajtovima (i svi ostali bajtovi zapisa) čuvaju se netaknuti.
const TONE_TYPES = [
  { v: 0, t: 'No tone' }, { v: 1, t: 'CTCSS' }, { v: 2, t: 'DCS normal (N)' }, { v: 3, t: 'DCS inverted (I)' }
];
const CTCSS_LIST = [
  67.0, 69.3, 71.9, 74.4, 77.0, 79.7, 82.5, 85.4, 88.5, 91.5, 94.8, 97.4, 100.0, 103.5, 107.2, 110.9,
  114.8, 118.8, 123.0, 127.3, 131.8, 136.5, 141.3, 146.2, 151.4, 156.7, 159.8, 162.2, 165.5, 167.9,
  171.3, 173.8, 177.3, 179.9, 183.5, 186.2, 189.9, 192.8, 196.6, 199.5, 203.5, 206.5, 210.7, 218.1,
  225.7, 229.1, 233.6, 241.8, 250.3, 254.1
];
const DCS_LIST = ('023 025 026 031 032 036 043 047 051 053 054 065 071 072 073 074 114 115 116 122 125 131 132 134 ' +
  '143 145 152 155 156 162 165 172 174 205 212 223 225 226 243 244 245 246 251 252 255 261 263 265 266 271 274 ' +
  '306 311 315 325 331 332 343 346 351 356 364 365 371 411 412 413 423 431 432 445 446 452 454 455 462 464 465 ' +
  '466 503 506 516 523 526 532 546 565 606 612 624 627 631 632 654 662 664 703 712 723 731 732 734 743 754').split(' ');

function u32le(r, o) { return (r[o] | r[o+1] << 8 | r[o+2] << 16 | r[o+3] * 16777216) >>> 0; }
function u16le(r, o) { return r[o] | r[o+1] << 8; }

function decodeTone(rec, valOff, typeOff) {
  const type = rec[typeOff] <= 3 ? rec[typeOff] : 0;
  const val = u16le(rec, valOff);
  const o = { type, ctcss: 88.5, dcs: '023', noneRaw: type === 0 ? val : 0xFFFF };
  if (type === 1) o.ctcss = val / 10;
  else if (type === 2 || type === 3) o.dcs = (val & 0x1FF).toString(8).padStart(3, '0');
  return o;
}

function decodeYsf(buf) {
  const slots = Math.min(MAX_CH, Math.max(0, Math.floor((Math.min(buf.length, TAIL_OFFSET) - HEADER_SIZE) / REC_SIZE)));
  const channels = [];
  for (let k = 0; k < slots; k++) {
    const off = HEADER_SIZE + k * REC_SIZE;
    const rec = buf.slice(off, off + REC_SIZE);
    const rxHz = u32le(rec, F_RX);
    if (rxHz === 0) continue;                   // prazno mesto
    let name = '';
    for (let i = F_NAME; i < F_NAME + NAME_LEN; i++) { if (rec[i] === 0) break; name += String.fromCharCode(rec[i]); }
    channels.push({
      name, rx: rxHz / 1e6, tx: (u32le(rec, F_TX) || rxHz) / 1e6,
      am: (rec[F_FLAGS] >> 2) & 1,
      scan: (rec[58] >> 7) & 1, pwr: (rec[58] >> 5) & 1, bw: (rec[58] >> 4) & 1, sdcs: (rec[58] >> 1) & 7, comp: rec[58] & 1,
      busy: (rec[57] >> 3) & 3, rxsig: (rec[57] >> 5) & 3,
      scr: rec[59] & 0x0F, vague: (rec[59] >> 4) & 1, push: rec[61], pop: rec[62],
      rxT: decodeTone(rec, F_RXT, F_RXT_TYPE), txT: decodeTone(rec, F_TXT, F_TXT_TYPE),
      raw: Array.from(rec)
    });
  }
  return channels;
}

function encodeTone(buf, off, valOff, typeOff, t) {
  buf[off + typeOff] = t.type;
  let v;
  if (t.type === 0) v = t.noneRaw;
  else if (t.type === 1) v = Math.round(t.ctcss * 10);
  else v = 0x2800 | parseInt(t.dcs, 8);
  buf[off + valOff] = v & 0xFF; buf[off + valOff + 1] = (v >> 8) & 0xFF;
}

function encodeYsf(channels, rawHeader, rawTail) {
  const buf = new Uint8Array(TOTAL_FILE_SIZE);
  buf.set(rawHeader.subarray(0, HEADER_SIZE), 0);
  // dinamička bitmaska zauzetih kanala (351..413)
  for (let i = 351; i <= 413; i++) buf[i] = 0x00;
  for (let k = 0; k < channels.length && k < MAX_CH; k++) {
    const n = k + 1;
    buf[351 + Math.floor(n / 8)] |= (1 << (n % 8));
  }
  const putU32 = (o, v) => { buf[o] = v & 0xFF; buf[o+1] = (v >> 8) & 0xFF; buf[o+2] = (v >> 16) & 0xFF; buf[o+3] = (v >>> 24) & 0xFF; };
  for (let k = 0; k < channels.length && k < MAX_CH; k++) {
    const off = HEADER_SIZE + k * REC_SIZE, ch = channels[k];
    if (ch.raw) buf.set(ch.raw, off);
    putU32(off + F_RX, Math.round(ch.rx * 1e6) >>> 0);
    putU32(off + F_TX, Math.round(ch.tx * 1e6) >>> 0);
    encodeTone(buf, off, F_RXT, F_RXT_TYPE, ch.rxT);
    encodeTone(buf, off, F_TXT, F_TXT_TYPE, ch.txT);
    buf[off + 57] = (buf[off + 57] & 0x87) | ((ch.busy & 3) << 3) | ((ch.rxsig & 3) << 5);
    buf[off + 58] = (buf[off + 58] & 0x40) | ((ch.scan & 1) << 7) | ((ch.pwr & 1) << 5) | ((ch.bw & 1) << 4) | ((ch.sdcs & 7) << 1) | (ch.comp & 1);
    buf[off + 59] = (buf[off + 59] & 0xE0) | ((ch.vague & 1) << 4) | (ch.scr & 0x0F);
    buf[off + F_FLAGS] = (buf[off + F_FLAGS] & 0x0B) | ((ch.am & 1) << 2) | (ch.rxT.type << 4) | (ch.txT.type << 6);
    buf[off + 61] = ch.push & 0xFF; buf[off + 62] = ch.pop & 0xFF;
    for (let i = 0; i < NAME_LEN; i++) buf[off + F_NAME + i] = i < ch.name.length ? (ch.name.charCodeAt(i) & 0xFF) : 0;
  }
  buf.set(rawTail.subarray(0, TAIL_SIZE), TAIL_OFFSET);
  return buf;
}


// ===== Pomoćne funkcije i model =====
const r6 = (x) => Math.round(x * 1e6) / 1e6;
const noTone = () => ({ type: 0, ctcss: 88.5, dcs: '023', noneRaw: 0xFFFF });
// novi (prazan) kanal nema frekvenciju: rx = tx = 0 se prikazuje kao prazno polje
const newChannel = (name) => ({ name, rx: 0, tx: 0, am: 0, scan: 1, pwr: 1, bw: 1, sdcs: 0, comp: 0,
  busy: 0, rxsig: 0, scr: 0, vague: 0, push: 0, pop: 0, rxT: noTone(), txT: noTone(), ex: {} });

// Opcije za padajuće menije (vrednost, tekst) - proverene u CPS-u 8118Plus
const OPT = {
  pwr: [[1, 'High'], [0, 'Low']],
  bw: [[1, 'Wide'], [0, 'Narrow']],
  scan: [[1, 'ADD'], [0, 'DEL']],
  busy: [[0, 'OFF'], [1, 'DQT'], [2, 'CAT']],
  sdcs: [[0, 'OFF'], [1, 'Special DCS 1'], [2, 'Special DCS 2'], [3, 'Special DCS 3'], [4, 'Special DCS 4']],
  onoff: [[0, 'OFF'], [1, 'ON']],
  scr: [[0, 'OFF']].concat(Array.from({ length: 8 }, (_, i) => [i + 1, 'scramble ' + (i + 1)])),
  mode: [[0, 'FM'], [1, 'AM']],
  rxsig: [[0, 'OFF'], [1, 'DTMF'], [2, 'FSK'], [3, 'FSK DTMF']],
  code: [[0, 'OFF'], [1, 'ID']].concat(Array.from({ length: 30 }, (_, i) => [i + 2, 'Code form-' + (i + 1)]))
};
// ako fajl sadrži vrednost koje nema na listi, prikaži je kao "?" i sačuvaj je netaknutu
function withCur(opts, cur) { return opts.some(o => o[0] === cur) ? opts : opts.concat([[cur, '? (' + cur + ')']]); }

function nearestCtcss(f) { return CTCSS_LIST.reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a); }
function csvCell(s) { s = String(s); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function parseCSVLine(line) {
  const out = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) { if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === ',') { out.push(cur); cur = ''; }
    else if (c === '"') inQ = true;
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function sameTone(a, b) {
  return a.type === b.type && (a.type === 0 || (a.type === 1 ? Math.abs(a.ctcss - b.ctcss) < 0.05 : a.dcs === b.dcs));
}

// ===== CHIRP / Radtel RT-920 CSV (21 kolona, CRLF, bez BOM-a - kao u priloženom fajlu) =====
const CHIRP_HEAD = ['Location','Name','Frequency','Duplex','Offset','Tone','rToneFreq','cToneFreq','DtcsCode','DtcsPolarity',
  'RxDtcsCode','CrossMode','Mode','TStep','Skip','Power','Comment','URCALL','RPT1CALL','RPT2CALL','DVCODE'];
const CROSS_MODES = ['Tone->Tone','DTCS->','->DTCS','Tone->DTCS','DTCS->Tone','->Tone','DTCS->DTCS','Tone->'];

function dirOf(ch) { const d = r6(ch.tx - ch.rx); return { dir: d === 0 ? '' : (d > 0 ? '+' : '-'), off: Math.abs(d) }; }

// CHIRP polja tona -> tonovi kanala (Dec = RX ton, Enc = TX ton)
function toneFromChirp(f) {
  const rT = parseFloat(f.rToneFreq) || 88.5, cT = parseFloat(f.cToneFreq) || 88.5;
  const pad = (s) => String(s || '023').padStart(3, '0');
  const dc = pad(f.DtcsCode), rdc = pad(f.RxDtcsCode || f.DtcsCode);
  const pol = String(f.DtcsPolarity || 'NN').toUpperCase();
  const mk = (kind, isTx, sameCode) => {
    const t = noTone();
    if (kind === 'Tone') { t.type = 1; t.ctcss = nearestCtcss(isTx ? rT : cT); }
    else if (kind === 'DTCS') {
      const code = isTx ? dc : (sameCode ? dc : rdc);
      if (DCS_LIST.includes(code)) { t.type = pol[isTx ? 0 : 1] === 'R' ? 3 : 2; t.dcs = code; }
    }
    return t;
  };
  const mode = f.Tone || '';
  if (mode === 'Tone') return { txT: mk('Tone', true), rxT: noTone() };
  if (mode === 'TSQL') return { txT: mk('Tone', false), rxT: mk('Tone', false) };
  if (mode === 'DTCS') return { txT: mk('DTCS', true), rxT: mk('DTCS', false, true) };
  if (mode === 'Cross') { const [a, b] = String(f.CrossMode || 'Tone->Tone').split('->'); return { txT: mk(a, true), rxT: mk(b, false) }; }
  return { txT: noTone(), rxT: noTone() };
}
function applyChirpTones(ch, f) {
  const r = toneFromChirp(f);
  ['rxT', 'txT'].forEach(k => { if (!(r[k].type === 0 && ch[k].type === 0)) ch[k] = r[k]; });
}
// kanal -> CHIRP polja
function chirpFields(ch) {
  const tx = ch.txT, rx = ch.rxT, kind = (t) => t.type === 0 ? '' : (t.type === 1 ? 'Tone' : 'DTCS');
  const dd = dirOf(ch);
  const f = { Duplex: dd.dir, Offset: dd.off, Tone: '',
    rToneFreq: (tx.type === 1 ? tx.ctcss : 88.5).toFixed(1), cToneFreq: (rx.type === 1 ? rx.ctcss : 88.5).toFixed(1),
    DtcsCode: tx.type >= 2 ? tx.dcs : '023', DtcsPolarity: (tx.type === 3 ? 'R' : 'N') + (rx.type === 3 ? 'R' : 'N'),
    RxDtcsCode: rx.type >= 2 ? rx.dcs : '023', CrossMode: 'Tone->Tone' };

// ===== CSV sa kolonama kao u CPS-u 8118Plus =====
const FULL_HEAD = ['NO.','RX Freq.','TX Freq.','QT/DQT Dec','QT/DQT Enc','TX Power','Bandwidth','Scan','Busy Inhibit','Special DCS',
  'Vague Subaudio','Compando','scramble','FM/AM','Rx signal Code','PTT Push Code','PTT Pop Code','Name'];
const toneLabel = (t) => t.type === 0 ? 'Off' : (t.type === 1 ? t.ctcss.toFixed(1) : 'D' + t.dcs + (t.type === 3 ? 'I' : 'N'));

function parseToneLabel(s) {
  const t = noTone(); s = String(s).trim();

  const m = /^D(\d{3})([NI])$/i.exec(s);
  if (m) { if (DCS_LIST.includes(m[1])) { t.type = m[2].toUpperCase() === 'I' ? 3 : 2; t.dcs = m[1]; } return t; }

function optVal(k, label, def) {

  const o = OPT[k].find(x => x[1].toLowerCase() === label.toLowerCase()); if (o) return o[0];
  const m = /^\? \((\d+)\)$/.exec(label); return m ? parseInt(m[1]) : def;

function toFullCsv(channels) {

  channels.forEach((ch, i) => lines.push([i + 1, ch.rx.toFixed(5), ch.tx.toFixed(5), toneLabel(ch.rxT), toneLabel(ch.txT),
    optLabel('pwr', ch.pwr), optLabel('bw', ch.bw), optLabel('scan', ch.scan), optLabel('busy', ch.busy), optLabel('sdcs', ch.sdcs),
    optLabel('onoff', ch.vague), optLabel('onoff', ch.comp), optLabel('scr', ch.scr), optLabel('mode', ch.am),
    optLabel('rxsig', ch.rxsig), optLabel('code', ch.push), optLabel('code', ch.pop), ch.name].map(csvCell).join(',')));

}
function fullRowToChannel(g, n) {
  const rx = parseFloat(g('RX Freq.')); if (!(rx > 0)) return null;
  let tx = parseFloat(g('TX Freq.')); if (!(tx > 0)) tx = rx;
  return Object.assign(newChannel(''), {
    name: (g('Name') || ('CH-' + n)).substring(0, 16), rx: r6(rx), tx: r6(tx),
    rxT: parseToneLabel(g('QT/DQT Dec')), txT: parseToneLabel(g('QT/DQT Enc')),
    pwr: optVal('pwr', g('TX Power'), 1), bw: optVal('bw', g('Bandwidth'), 1), scan: optVal('scan', g('Scan'), 1),
    busy: optVal('busy', g('Busy Inhibit'), 0), sdcs: optVal('sdcs', g('Special DCS'), 0),
    vague: optVal('onoff', g('Vague Subaudio'), 0), comp: optVal('onoff', g('Compando'), 0), scr: optVal('scr', g('scramble'), 0),
    am: optVal('mode', g('FM/AM'), 0), rxsig: optVal('rxsig', g('Rx signal Code'), 0),
    push: optVal('code', g('PTT Push Code'), 0), pop: optVal('code', g('PTT Pop Code'), 0) });
}
// prepoznaje oba formata (CHIRP / CPS kolone)
function parseAnyCsv(text) {
  text = String(text).replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  const res = { channels: [], skipped: 0, kind: '' };
  if (lines.length < 2) return res;
  const head = parseCSVLine(lines[0]);
  const chirp = head.indexOf('Frequency') >= 0, full = head.indexOf('RX Freq.') >= 0;
  if (!chirp && !full) return res;
  res.kind = chirp ? 'chirp' : 'full';
  for (let i = 1; i < lines.length && res.channels.length < MAX_CH; i++) {
    const row = parseCSVLine(lines[i]);
    const g = (n) => { const ix = head.indexOf(n); return ix >= 0 && ix < row.length ? row[ix].trim() : ''; };
    const ch = chirp ? chirpRowToChannel(g, i) : fullRowToChannel(g, i);

}

(function () {

})();

const $ = (id) => document.getElementById(id);
function setMsg(txt, cls) { const m = $('msg'); m.className = 'msg ' + (cls || ''); m.textContent = txt; }
function download(name, data, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: mime || 'application/octet-stream' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function resetFromTemplate() { if (templateBuf) { rawHeader = templateBuf.slice(0, HEADER_SIZE); rawTail = templateBuf.slice(TAIL_OFFSET); } }

function initEmpty() {
  resetFromTemplate();
  channels = [];
  for (let i = 0; i < 16; i++) channels.push(newChannel('Channel ' + (i + 1)));

  resetHistory(); setSel([0], 0); render();
  setMsg('A new empty working list was created.', 'succ');
}

// ===== Učitavanje .Ysf =====
$('fYsf').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf.length < TOTAL_FILE_SIZE) setMsg('Warning: the file is smaller than the standard 47,046 B and will be padded when saved.', 'err');
  rawHeader = buf.slice(0, HEADER_SIZE);
  rawTail = buf.length >= TOTAL_FILE_SIZE ? buf.slice(TAIL_OFFSET, TAIL_OFFSET + TAIL_SIZE)
          : (templateBuf ? templateBuf.slice(TAIL_OFFSET) : new Uint8Array(TAIL_SIZE));
  channels = decodeYsf(buf); fileBase = baseName(file.name);
  resetHistory(); setSel(channels.length ? [0] : [], 0); render();
  if (buf.length >= TOTAL_FILE_SIZE) setMsg('Successfully loaded ' + channels.length + ' channels from the .Ysf file.', 'succ');
  e.target.value = '';
};

// ===== Uvoz CSV (prepoznaje CHIRP/Radtel format i CSV sa CPS kolonama) =====
$('fCsv').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const r = parseAnyCsv(evt.target.result);
    if (!r.kind) { setMsg('CSV not recognized: a CHIRP/Radtel format CSV is expected.', 'err'); return; }
    if (!r.channels.length) { setMsg('No valid channel was found in the CSV file.', 'err'); return; }
    resetFromTemplate();
    resetHistory(); channels = r.channels; fileBase = baseName(file.name); setSel([0], 0); render();
    setMsg('Imported ' + r.channels.length + ' channels from CSV (' + (r.kind === 'chirp' ? 'CHIRP/Radtel format' : 'CPS columns') + ')' +
      (r.skipped ? ', skipped ' + r.skipped : '') + '. Parameters that the CSV does not contain were left at their default values.', 'succ');
  };
  reader.readAsText(file); e.target.value = '';
};

// ===== Gradivni elementi tabele =====
function mkSel(options, current, onchange, disabled) {
  const s = document.createElement('select');
  options.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; if (String(v) === String(current)) o.selected = true; s.appendChild(o); });
  s.disabled = !!disabled; s.onchange = () => onchange(s.value); return s;
}

    const a = channels[i], b = other[i];
    if (!a) { lines.push('#' + (i + 1) + '  only in the other file: ' + b.name); diffRows++; continue; }
    if (!b) { lines.push('#' + (i + 1) + '  only in this editor: ' + a.name); diffRows++; continue; }
    const d = DIFF_FIELDS.filter(f => f[1](a) !== f[1](b)).map(f => f[0] + ': ' + f[1](a) + ' → ' + f[1](b));
    if (d.length) { diffRows++; lines.push('#' + (i + 1) + '  ' + a.name + '  |  ' + d.join('  |  ')); }
  }
  box.appendChild(p(diffRows ? 'Channels differ in ' + diffRows + ' of ' + n + ' rows (compared by row number; "A → B" = this editor → ' + file.name + ').'
    : 'No differences: all channels are the same.', 'hint'));
  const pre = document.createElement('pre'); pre.textContent = lines.slice(0, 1000).join('\n') + (lines.length > 1000 ? '\n… (first 1000 shown)' : ''); box.appendChild(pre);
  openModal('Comparison with file ' + file.name, box);
};

// ===== Iseci izabrano (samo označeni tekst u polju) =====
let ctxSel = null;
function captureTextSel(t) {
  if (!t || t.tagName !== 'INPUT') return null;
  let s = null, e = null, txt = '';
  try { s = t.selectionStart; e = t.selectionEnd; if (s != null && e != null && e > s) txt = t.value.slice(s, e); } catch (_) {}
  if (!txt) {   // number polja ne daju indekse - probaj preko selekcije pregledača
    const g = String(window.getSelection ? window.getSelection() : '');
    const at = g ? t.value.indexOf(g) : -1;
    if (at >= 0) { s = at; e = at + g.length; txt = g; }
  }
  return txt ? { input: t, start: s, end: e, text: txt, value: t.value } : null;
}
async function cutText(info) {
  if (!info) return;
  const t = info.input;
  if (!t.isConnected || t.value !== info.value) { setMsg('The field changed in the meantime - select the text again.', 'err'); return; }
  const nv = info.value.slice(0, info.start) + info.value.slice(info.end);
  if (t.type === 'number' && (nv === '' || isNaN(parseFloat(nv)))) { setMsg('Cannot cut: the field would be left empty or invalid.', 'err'); return; }
  await writeClip(info.text);
  t.value = nv; t.dispatchEvent(new Event('change', { bubbles: true }));   // upiši izmenu u kanal (i u Poništi)
  setMsg('Cut selected text: "' + info.text + '".', 'succ');
}

// ===== Kontekstni meni (desni klik) =====
function hideMenu() { $('ctx').hidden = true; }
function showMenu(x, y) {
  const m = $('ctx'); m.innerHTML = ''; m.className = x > innerWidth - 520 ? 'left' : '';
  const n = sel.size, any = n > 0;
  const add = (parent, label, hint, fn, on) => {
    const d = document.createElement('div'); d.className = 'mi' + (on === false ? ' dis' : '');
    const l = document.createElement('span'); l.textContent = label; d.appendChild(l);
    if (hint) { const h = document.createElement('small'); h.textContent = hint; d.appendChild(h); }
    if (on !== false) d.onclick = (e) => { e.stopPropagation(); hideMenu(); fn(); };
    parent.appendChild(d);
  };
  const sep = () => { const d = document.createElement('div'); d.className = 'msep'; m.appendChild(d); };
  const subm = (label, items, on) => {
    const d = document.createElement('div'); d.className = 'mi has' + (on === false ? ' dis' : '');
    const l = document.createElement('span'); l.textContent = label; d.appendChild(l);
    const a = document.createElement('small'); a.textContent = '▸'; d.appendChild(a);
    const s = document.createElement('div'); s.className = 'submenu';
    items.forEach(it => add(s, it[0], it[2] || '', it[1], on));
    d.appendChild(s); m.appendChild(d);
  };
  add(m, 'Properties', '', showProps, any);
  add(m, 'Insert Row Above', 'Insert', () => insertAbove(false), channels.length < MAX_CH);
  sep();
  add(m, 'Cut', 'whole channel · Ctrl+X', doCut, any);
  add(m, 'Cut selection', 'selected text only', () => cutText(ctxSel), !!ctxSel);
  add(m, 'Copy', 'Ctrl+C', () => doCopy(false), any);
  add(m, 'Copy portable', 'CSV text', () => doCopy(true), any);
  add(m, 'Paste (overwrite)', 'Ctrl+V', () => doPaste(false), true);
  add(m, 'Paste (insert above)', 'Ctrl+Shift+V', () => doPaste(true), true);
  subm('Delete', [['Delete and shift up', delSel, 'Delete'], ['Reset to default (keep position)', blankSel, '']], any);
  const sortItems = [];
  Object.keys(SORTS).forEach(k => { sortItems.push([SORTS[k][0] + ' ▲ ascending', () => sortSel(k, false)]); sortItems.push([SORTS[k][0] + ' ▼ descending', () => sortSel(k, true)]); });
  subm('Sort ' + n + ' channel' + (n === 1 ? '' : 's'), sortItems, n > 1);
  sep();
  add(m, 'Show Raw Memory', '', showRaw, any);
  add(m, 'Diff Raw Memories (2 channels)', '', showDiffRaw, n === 2);
  add(m, 'Diff against another file…', '', () => $('fDiff').click(), channels.length > 0);
  m.hidden = false;
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
}
$('tb').addEventListener('contextmenu', (e) => {
  const tr = e.target.closest('tr'); if (!tr) return;
  e.preventDefault();
  const idx = +tr.dataset.idx;
  ctxSel = captureTextSel(e.target);
  if (!sel.has(idx)) { setSel([idx], idx); anchor = idx; paintSel(); } else primary = idx;
  showMenu(e.clientX, e.clientY);
});
document.addEventListener('mousedown', (e) => { if (!$('ctx').hidden && !e.target.closest('#ctx')) hideMenu(); });
window.addEventListener('blur', hideMenu); $('wrap').addEventListener('scroll', hideMenu);

// ===== Prečice na tastaturi =====
const isTyping = (t) => t && ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName);
document.addEventListener('keydown', (e) => {
  lastShift = e.shiftKey;
  if (e.key === 'Escape') { hideMenu(); if (!$('confirm').hidden) { $('ccancel').click(); return; } if (!$('modal').hidden) closeModal(); return; }
  if (isTyping(e.target) || !$('modal').hidden || !$('confirm').hidden) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'c') { e.preventDefault(); doCopy(false); }
  else if (mod && k === 'x') { e.preventDefault(); doCut(); }
  else if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (mod && k === 'a') { e.preventDefault(); setSel(lastVisible, lastVisible[0]); paintSel(); }
  else if (e.key === 'Delete') { e.preventDefault(); delSel(); }
  else if (e.key === 'Insert') { e.preventDefault(); insertAbove(false); }
});
document.addEventListener('keyup', (e) => { lastShift = e.shiftKey; });
document.addEventListener('paste', (e) => {
  if (isTyping(e.target) || !$('modal').hidden || !$('confirm').hidden) return;
  e.preventDefault();
  let rows = parseClipText(e.clipboardData ? e.clipboardData.getData('text') : '');
  if (!rows && internalClip) rows = JSON.parse(internalClip);
  pasteRows(rows, lastShift);
});

// ===== Dugmad =====
$('bInsEmpty').onclick = () => insertAbove(false);
$('bInsCopy').onclick = () => insertAbove(true);
$('bDel').onclick = delSel;
$('bUp').onclick = () => moveSel(-1);
$('bDn').onclick = () => moveSel(1);
$('bUndo').onclick = undo;
$('bRedo').onclick = redo;
$('bNew').onclick = initEmpty;
const skippedNote = (n) => n ? ' Skipped ' + n + ' empty rows without an RX frequency.' : '';
$('bSaveYsf').onclick = () => {
  const out = validChannels();
  if (!out.length) { setMsg('No channel has an RX frequency - nothing to save.', 'err'); return; }
  const nm = (fileBase || DEFAULT_NAME) + '.Ysf';
  download(nm, encodeYsf(out, rawHeader, rawTail));
  setMsg('Saved file ' + nm + ' (exactly 47,046 bytes - ready for the CPS).' + skippedNote(channels.length - out.length), 'succ');
};
const bChirp = $('bCsvChirp');
if (bChirp) bChirp.onclick = () => {
  const out = validChannels();
  if (!out.length) { setMsg('No channel has an RX frequency - nothing to export.', 'err'); return; }
  download((fileBase || 'Radtel_RT-920_export') + '.csv', toChirpCsv(out), 'text/csv');
  setMsg('Exported ' + out.length + ' channels to CSV.' + skippedNote(channels.length - out.length), 'succ');
};
